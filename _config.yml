# ===== 站点基本信息 =====
title: 我的博客
subtitle: 记点东西
description: 一个放在 Cloudflare 上的静态博客
keywords: 博客,笔记
author: 博主
language: zh-CN
timezone: Asia/Shanghai

# ===== 重点：换成你要绑定的域名，结尾不要带 / =====
# 示例写的是 blog.example.com，部署前把它换成你自己的真实域名
url: https://blog.example.com
root: /
# 文章地址形如 /archives/文章名/
permalink: archives/:title/
permalink_defaults:

# ===== 目录 =====
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
# 后台页面不能被套上主题模板，否则 /admin 会打不开（Sveltia CMS 官方对 Hexo 的要求）
skip_render:
  - admin/**

# ===== 写作 =====
new_post_name: :title.md
default_layout: post
titlecase: false
# 图片统一放 source/images/uploads/，文章里写 ![说明](/images/uploads/文件名.png)
# 这些文件会原样复制到 public/images/uploads/，由 Cloudflare Pages 免费分发
post_asset_folder: false
relative_link: false
render_drafts: false
future: true
filename_case: 0

# ===== 列表分页 =====
index_generator:
  path: ''
  per_page: 10
  order_by: -date
archive_generator:
  enable: true
  per_page: 10
  yearly: true
  monthly: true
  daily: false
tag_generator:
  enable: true
category_generator:
  enable: true

# ===== 主题 =====
theme: butterfly

# ===== 代码高亮 =====
syntax_highlighter: highlight.js
highlight:
  wrap: true
  line_number: true
  auto_detect: false
  tab_replace: ''
prismjs:
  enable: false
